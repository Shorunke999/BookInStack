<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookStack — SDK Test Console</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:    #0d0d14; --muted:  #64748b; --border: #e2e8f0;
      --soft:   #f8fafc; --accent: #4f46e5; --green:  #10b981;
      --red:    #ef4444; --yellow: #f59e0b; --dark:   #1e1e2e;
    }
    body { font-family:'DM Sans',sans-serif; background:var(--soft); color:var(--ink); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
    .topbar { background:var(--ink); color:#fff; padding:0 20px; height:52px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .topbar-brand { font-size:15px; font-weight:700; }
    .topbar-brand span { color:#818cf8; }
    .topbar-right { display:flex; align-items:center; gap:14px; }
    .sdk-badge { font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.06em; }
    .sdk-badge.idle  { background:rgba(255,255,255,.08); color:#94a3b8; }
    .sdk-badge.ready { background:rgba(16,185,129,.15);  color:#34d399; }
    .sdk-badge.error { background:rgba(239,68,68,.15);   color:#f87171; }
    .mode-pill { font-size:12px; font-weight:600; padding:4px 12px; border-radius:20px; background:rgba(79,70,229,.15); color:#818cf8; }
    .layout { display:grid; grid-template-columns:320px 1fr; flex:1; overflow:hidden; }
    .left { background:#fff; border-right:1px solid var(--border); overflow-y:auto; display:flex; flex-direction:column; }
    .section { padding:16px; border-bottom:1px solid var(--border); }
    .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; }
    .field { margin-bottom:10px; }
    .field label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
    .field input, .field select { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); }
    .field input:focus, .field select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.08); }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; border:none; transition:all .15s; }
    .btn-primary { background:var(--accent); color:#fff; width:100%; justify-content:center; }
    .btn-primary:hover:not(:disabled) { background:#4338ca; }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-sm { padding:5px 10px; font-size:12px; }
    .btn-outline { background:#fff; border:1px solid var(--border); color:var(--ink); }
    .btn-outline:hover { background:var(--soft); }
    .tabs { display:flex; border-bottom:1px solid var(--border); background:#fff; flex-shrink:0; }
    .tab { padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; transition:all .15s; user-select:none; }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .right { display:flex; flex-direction:column; overflow:hidden; }
    .panel { flex:1; overflow-y:auto; padding:24px; display:none; }
    .panel.active { display:block; }
    .log-wrap { flex:1; background:var(--dark); font-family:'DM Mono',monospace; font-size:12px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:3px; }
    .log-entry { display:grid; grid-template-columns:52px 68px 1fr; gap:8px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .log-time { color:#4b5563; }
    .log-type { font-weight:600; }
    .log-type.req     { color:#818cf8; }
    .log-type.res     { color:#34d399; }
    .log-type.success { color:#34d399; }
    .log-type.error   { color:#f87171; }
    .log-type.info    { color:#60a5fa; }
    .log-type.warn    { color:#fbbf24; }
    .log-type.event   { color:#a78bfa; }
    .log-msg  { color:#e2e8f0; word-break:break-all; }
    .log-data { color:#6b7280; font-size:11px; margin-top:1px; white-space:pre-wrap; }
    .log-clear { padding:6px 12px; background:none; border:1px solid #374151; color:#6b7280; border-radius:5px; font-size:11px; cursor:pointer; align-self:flex-end; margin-bottom:6px; }
    .log-clear:hover { color:#9ca3af; }
    .chip { font-size:12px; font-family:'DM Mono',monospace; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; padding:4px 10px; border-radius:6px; margin-top:8px; display:none; }
    .catalog-info { background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:20px; }
    .catalog-info h4 { font-size:13px; font-weight:700; margin-bottom:10px; }
    .catalog-item { display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .catalog-item:last-child { border-bottom:none; }
    .catalog-price { font-weight:700; color:var(--accent); font-family:'DM Mono',monospace; white-space:nowrap; margin-left:12px; }
    .widget-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">BookStack <span>SDK Console</span></div>
  <div class="topbar-right">
    <span id="mode-pill" style="display:none;" class="mode-pill"></span>
    <span id="status-badge" class="sdk-badge idle">Not initialized</span>
  </div>
</div>

<div class="layout">

  <!-- ── Left panel ──────────────────────────────────────────── -->
  <div class="left">

    <div class="section">
      <div class="section-title">① Configure</div>
      <div class="field"><label>Public Key</label><input id="cfg-key" type="text" placeholder="pk_live_..." /></div>
      <div class="field"><label>Base URL</label><input id="cfg-url" type="text" value="http://localhost:8000/api" /></div>
      <div class="field"><label>Return URL</label><input id="cfg-return" type="text" value="http://localhost:8000/test" /></div>
      <button class="btn btn-primary" onclick="doInit()">⚡ Initialize SDK</button>
    </div>

    <div class="section">
      <div class="section-title">② Create Booking</div>

      <div class="field">
        <label>Category</label>
        <select id="c-category">
          <option value="">— initialize first —</option>
        </select>
      </div>

      <div class="field"><label>Customer Email</label><input id="c-email" type="email" value="test@example.com" /></div>
      <div class="field"><label>Customer Name</label><input id="c-name" type="text" value="Test Customer" /></div>
      <div class="field"><label>Customer Phone</label><input id="c-phone" type="text" placeholder="08012345678" /></div>

      <div id="mode-extra-fields"></div>

      <button class="btn btn-primary" onclick="doCreate()" id="btn-create">📋 Booking.create()</button>
      <div class="chip" id="create-chip"></div>
    </div>

    <div class="section">
      <div class="section-title">③ Pay</div>
      <div class="field"><label>Booking Reference</label><input id="p-ref" type="text" placeholder="BKG-XXXXXXXXXXXX" /></div>
      <button class="btn btn-primary" onclick="doPay()">💳 Booking.pay()</button>
    </div>

    <div class="section">
      <div class="section-title">④ List & Get</div>
      <div class="field"><label>Page</label><input id="l-page" type="number" value="1" min="1" style="max-width:80px;" /></div>
      <button class="btn btn-primary btn-sm" onclick="doList()" id="btn-list" style="width:auto;margin-bottom:10px;">📄 Booking.list()</button>
      <div class="field"><label>Reference</label><input id="g-ref" type="text" placeholder="BKG-XXXXXXXXXXXX" /></div>
      <button class="btn btn-primary btn-sm" onclick="doGet()" style="width:auto;">🔍 Booking.get()</button>
    </div>

    <div class="section">
      <div class="section-title">⑤ Attendance</div>
      <div class="field"><label>Reference (paid)</label><input id="a-ref" type="text" placeholder="BKG-XXXXXXXXXXXX" /></div>
      <div class="field"><label>Note (optional)</label><input id="a-note" type="text" placeholder="Seat A14" /></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="doAttend(true)"  style="flex:1;">✓ Mark</button>
        <button class="btn btn-outline btn-sm" onclick="doAttend(false)" style="flex:1;">✗ Undo</button>
      </div>
    </div>

  </div>

  <!-- ── Right panel ─────────────────────────────────────────── -->
  <div class="right">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('log',    this)">Console Log</div>
      <div class="tab"        onclick="switchTab('widget', this)">Widget Preview</div>
    </div>

    <div class="panel active" id="panel-log" style="padding:0;display:flex;flex-direction:column;">
      <div class="log-wrap" id="log">
        <button class="log-clear" onclick="clearLog()">clear</button>
      </div>
    </div>

    <div class="panel" id="panel-widget">
      <div class="widget-toolbar">
        <div>
          <div style="font-weight:700;font-size:15px;">Widget Preview</div>
          <div style="font-size:13px;color:var(--muted);margin-top:2px;" id="widget-mode-label">
            Initialize the SDK first.
          </div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="renderWidget()">↺ Re-render</button>
      </div>

      <div class="catalog-info" id="catalog-info" style="display:none;">
        <h4>📦 Catalog received from API</h4>
        <div id="catalog-list"></div>
      </div>

      <div id="w-main"></div>
    </div>
  </div>

</div>

<script src="booking.js"></script>
<script>

  // ── Tabs ───────────────────────────────────────────────────
  function switchTab(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => { p.style.display='none'; p.classList.remove('active'); });
    el.classList.add('active');
    const panel = document.getElementById('panel-' + id);
    panel.style.display = id === 'log' ? 'flex' : 'block';
    panel.classList.add('active');
    if (id === 'widget' && Booking.modeConfig) renderWidget();
  }

  // ── Log ────────────────────────────────────────────────────
  function log(type, msg, data) {
    const wrap = document.getElementById('log');
    const time = new Date().toTimeString().slice(0,8);
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `
      <span class="log-time">${time}</span>
      <span class="log-type ${type}">${type.toUpperCase()}</span>
      <div>
        <div class="log-msg">${msg}</div>
        ${data != null ? `<div class="log-data">${JSON.stringify(data, null, 2)}</div>` : ''}
      </div>`;
    wrap.appendChild(entry);
    wrap.scrollTop = wrap.scrollHeight;
  }
  function clearLog() {
    const wrap = document.getElementById('log');
    wrap.innerHTML = '<button class="log-clear" onclick="clearLog()">clear</button>';
  }
  function setBadge(state, text) {
    const b = document.getElementById('status-badge');
    b.className = `sdk-badge ${state}`;
    b.textContent = text;
  }
  function showChip(id, text) {
    const c = document.getElementById(id);
    c.style.display = 'inline-block';
    c.textContent = text;
  }

  // ── Populate category <select> from catalog ────────────────
  function populateCategorySelect(catalog, mode) {
    const sel = document.getElementById('c-category');
    sel.innerHTML = '';
    if (!catalog || catalog.length === 0) {
      sel.innerHTML = '<option value="">No categories found for this mode</option>';
      return;
    }
    catalog.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.id;
      const price = '₦' + (cat.price / 100).toLocaleString('en-NG', { minimumFractionDigits: 2 });
      const suffix = mode === 'reservation' ? '/night' : '';
      opt.textContent = `${cat.name} — ${price}${suffix}`;
      sel.appendChild(opt);
    });
  }

  // ── Catalog info card in widget panel ─────────────────────
  function showCatalogInfo(catalog, mode) {
    const box  = document.getElementById('catalog-info');
    const list = document.getElementById('catalog-list');
    box.style.display = 'block';
    if (!catalog || catalog.length === 0) {
      list.innerHTML = '<div style="color:var(--muted);font-size:13px;font-style:italic;">No active categories for this mode.</div>';
      return;
    }
    list.innerHTML = catalog.map(cat => {
      const price  = '₦' + (cat.price / 100).toLocaleString('en-NG', { minimumFractionDigits: 2 });
      const suffix = mode === 'reservation' ? '/night' : '';
      const meta   = [
        cat.duration_minutes    ? `⏱ ${cat.duration_minutes}min`        : '',
        cat.capacity            ? `👥 cap ${cat.capacity}`               : '',
        cat.enable_child_pricing && cat.child_price
          ? `Child: ₦${(cat.child_price/100).toLocaleString('en-NG')}` : '',
      ].filter(Boolean).join('  ');
      return `
        <div class="catalog-item">
          <div>
            <div style="font-weight:600;">${cat.name}</div>
            ${cat.description ? `<div style="font-size:12px;color:var(--muted);">${cat.description}</div>` : ''}
            ${meta ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;">${meta}</div>` : ''}
          </div>
          <div class="catalog-price">${price}${suffix}</div>
        </div>`;
    }).join('');
  }

  // ── Mode-specific fields in Create form ───────────────────
  function applyModeToForm(mode) {
    const wrap = document.getElementById('mode-extra-fields');
    const today    = new Date().toISOString().split('T')[0];
    const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];

    const map = {
      ticket: `
        <div class="field"><label>Adults</label><input id="c-adults"   type="number" value="1" min="1" /></div>
        <div class="field"><label>Children</label><input id="c-children" type="number" value="0" min="0" /></div>`,
      reservation: `
        <div class="field"><label>Check-in</label><input id="c-checkin"  type="date" value="${today}"    min="${today}" /></div>
        <div class="field"><label>Check-out</label><input id="c-checkout" type="date" value="${tomorrow}" min="${tomorrow}" /></div>`,
      appointment: `
        <div class="field"><label>Preferred Date</label><input id="c-date" type="date" value="${today}" min="${today}" /></div>
        <div class="field"><label>Preferred Time</label><input id="c-time" type="time" value="09:00" /></div>`,
    };
    wrap.innerHTML = map[mode.mode] || '';
  }

  // ── 1. Initialize ──────────────────────────────────────────
  async function doInit() {
    const publicKey = document.getElementById('cfg-key').value.trim();
    const baseUrl   = document.getElementById('cfg-url').value.trim();
    const returnUrl = document.getElementById('cfg-return').value.trim();

    if (!publicKey) { log('error', 'Public key is required'); return; }

    const btn = document.querySelector('[onclick="doInit()"]');
    btn.disabled = true; btn.textContent = '⏳ Initializing…';

    try {
      await Booking.init({ publicKey, baseUrl, returnUrl });

      const mode    = Booking.modeConfig;
      const catalog = Booking.catalog;

      setBadge('ready', `Ready ✓ · ${mode.label}`);

      const pill = document.getElementById('mode-pill');
      pill.textContent = `${{ appointment:'🗓', ticket:'🎟', reservation:'🏨' }[mode.mode] || '📋'} ${mode.label}`;
      pill.style.display = 'inline-block';

      log('success', 'SDK initialized');
      log('info',    `Mode: ${mode.mode}`, mode);
      log('info',    `Catalog: ${catalog.length} item(s)`, catalog);
      log('info',    `Window open: ${Booking.bookingOpen}` +
                     (Booking.bookingReason ? ` — ${Booking.bookingReason}` : ''));

      populateCategorySelect(catalog, mode.mode);
      applyModeToForm(mode);

      ['ready','booking:created','payment:redirecting','payment:success','booking:attendance']
        .forEach(name => window.addEventListener(`bookstack:${name}`, e =>
          log('event', `bookstack:${name}`, e.detail)));

      if (document.getElementById('panel-widget').classList.contains('active')) {
        showCatalogInfo(catalog, mode.mode);
        renderWidget();
      }

    } catch (err) {
      setBadge('error', 'Init failed');
      log('error', err.message);
    } finally {
      btn.disabled    = false;
      btn.textContent = '⚡ Initialize SDK';
    }
  }

  // ── 2. Create ─────────────────────────────────────────────
  async function doCreate() {
    const mode       = Booking.modeConfig;
    const categoryId = document.getElementById('c-category').value;

    if (!categoryId) {
      log('error', 'Select a category (initialize SDK first to load them)'); return;
    }

    const params = {
      category_id:    parseInt(categoryId),
      customer_email: document.getElementById('c-email').value.trim(),
      customer_name:  document.getElementById('c-name').value.trim()  || undefined,
      customer_phone: document.getElementById('c-phone').value.trim() || undefined,
    };

    if (mode?.mode === 'ticket') {
      params.adults   = parseInt(document.getElementById('c-adults')?.value   || 1);
      params.children = parseInt(document.getElementById('c-children')?.value || 0);
    } else if (mode?.mode === 'reservation') {
      params.check_in  = document.getElementById('c-checkin')?.value;
      params.check_out = document.getElementById('c-checkout')?.value;
      if (!params.check_in || !params.check_out) {
        log('error', 'Check-in and check-out are required'); return;
      }
    } else if (mode?.mode === 'appointment') {
      params.preferred_date = document.getElementById('c-date')?.value;
      params.preferred_time = document.getElementById('c-time')?.value;
    }

    const btn = document.getElementById('btn-create');
    btn.disabled = true; btn.textContent = '⏳ Creating…';
    log('req', 'POST /bookings', params);

    try {
      const booking = await Booking.create(params);
      ['p-ref','g-ref','a-ref'].forEach(id => document.getElementById(id).value = booking.reference);
      showChip('create-chip', `✓ ${booking.reference}  ·  ${booking.status}`);
      log('success', 'Booking created', booking);
    } catch (err) {
      log('error', `Create failed: ${err.message}`, err.data || null);
    } finally {
      btn.disabled    = false;
      btn.textContent = '📋 Booking.create()';
    }
  }

  // ── 3. Pay ────────────────────────────────────────────────
  async function doPay() {
    const ref       = document.getElementById('p-ref').value.trim();
    const returnUrl = document.getElementById('cfg-return').value.trim();
    if (!ref)       { log('error', 'Enter a booking reference'); return; }
    if (!returnUrl) { log('error', 'Return URL is required');    return; }
    log('req',  `POST /payments/initialize  ref: ${ref}`);
    log('warn', `Redirecting to Paystack — return URL: ${returnUrl}`);
    try { await Booking.pay(ref, { returnUrl }); }
    catch (err) { log('error', `Pay failed: ${err.message}`, err.data || null); }
  }

  // ── 4. List ───────────────────────────────────────────────
  async function doList() {
    const btn  = document.getElementById('btn-list');
    const page = parseInt(document.getElementById('l-page').value) || 1;
    btn.disabled = true; btn.textContent = '⏳…';
    log('req', `GET /bookings?page=${page}`);
    try {
      const r = await Booking.list({ page });
      log('res', `${r.data?.length ?? 0} bookings (total: ${r.total ?? '?'})`, r);
    } catch (err) {
      log('error', `List failed: ${err.message}`, err.data || null);
    } finally { btn.disabled = false; btn.textContent = '📄 Booking.list()'; }
  }

  // ── 5. Get ────────────────────────────────────────────────
  async function doGet() {
    const ref = document.getElementById('g-ref').value.trim();
    if (!ref) { log('error', 'Enter a reference'); return; }
    log('req', `GET /bookings/${ref}`);
    try { const b = await Booking.get(ref); log('res', `Got ${b.reference}`, b); }
    catch (err) { log('error', `Get failed: ${err.message}`, err.data || null); }
  }

  // ── 6. Attend ─────────────────────────────────────────────
  async function doAttend(attended) {
    const ref  = document.getElementById('a-ref').value.trim();
    const note = document.getElementById('a-note').value.trim();
    if (!ref) { log('error', 'Enter a reference (booking must be paid)'); return; }
    log('req', `POST /bookings/${ref}/attend`, { attended, note: note || null });
    try {
      const r = await Booking.attend(ref, { attended, note: note || undefined });
      log('success', `Attendance updated`, r);
    } catch (err) { log('error', `Attend failed: ${err.message}`, err.data || null); }
  }

  // ── Widget render ─────────────────────────────────────────
  function renderWidget() {
    const mode    = Booking.modeConfig;
    const catalog = Booking.catalog;
    if (!mode) { log('warn', 'Initialize SDK before previewing widget'); return; }

    const emoji = { appointment:'🗓', ticket:'🎟', reservation:'🏨' }[mode.mode] || '📋';
    document.getElementById('widget-mode-label').textContent =
      `${emoji} ${mode.label} mode · ${catalog.length} categor${catalog.length === 1 ? 'y' : 'ies'} loaded`;

    showCatalogInfo(catalog, mode.mode);

    document.getElementById('w-main').innerHTML = '';
    Booking.widget('#w-main', {
      title: mode.cta,
      returnUrl: document.getElementById('cfg-return').value.trim(),
    });

    log('info', `Widget rendered — ${mode.mode} · ${catalog.length} categories`);
  }

  // ── Paystack return ────────────────────────────────────────
  window.addEventListener('load', () => {
    const p   = new URLSearchParams(window.location.search);
    const ref = p.get('reference') || p.get('trxref');
    if (ref) {
      log('success', '↩ Returned from Paystack', { paystack_reference: ref });
      log('info', 'Webhook updates booking status server-side.');
      history.replaceState({}, '', location.pathname);
    }
  });

</script>
</body>
</html>
